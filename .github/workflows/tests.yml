# Offline tests on every push: golden SQL files and rejected questions of the semantic
# layer, and the agent loop and eval scoring with a scripted fake model (no LLM calls).
# They compile SQL without touching BigQuery, so no credentials are needed;
# the live checks against the marts run in the monthly refresh.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml==6.0.3 pytest==8.4.2

      - name: Golden SQL, rejections and agent loop
        run: python -m pytest
