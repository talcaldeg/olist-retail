version: 2

models:
  - name: stg_customers
    description: One row per customer_id. The same person can have several customer_ids; customer_unique_id identifies the person.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
      - name: customer_zip_code_prefix
        data_tests: [not_null]

  - name: stg_geolocation
    description: Raw geolocation points, several per zip prefix.
    columns:
      - name: zip_code_prefix
        data_tests: [not_null]

  - name: stg_order_items
    description: One row per item within an order.
    data_tests:
      - unique:
          column_name: "concat(order_id, '-', cast(order_item_id as string))"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id
      - name: price
        data_tests: [not_null]

  - name: stg_order_payments
    description: One row per payment of an order; an order can be paid in several parts.
    data_tests:
      - unique:
          column_name: "concat(order_id, '-', cast(payment_sequential as string))"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]

  - name: stg_order_reviews
    description: One row per (review_id, order_id).
    data_tests:
      - unique:
          column_name: "concat(review_id, '-', order_id)"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: purchased_at
        data_tests: [not_null]

  - name: stg_products
    description: One row per product.
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_sellers
    description: One row per seller.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_product_category_name_translation
    description: Portuguese to English category names.
    columns:
      - name: product_category_name
        data_tests: [unique, not_null]
