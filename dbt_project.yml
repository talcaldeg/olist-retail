name: olist_retail
version: "0.1.0"
config-version: 2
profile: olist_retail

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

models:
  olist_retail:
    # Staging is a thin, one-to-one cleanup of raw_olist: views cost nothing to store
    # and always reflect the latest load.
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    # Facts are read by every mart and by the semantic layer: store them once.
    dimensional:
      +materialized: table

seeds:
  olist_retail:
    +column_types:
      category: string
      family: string
    category_cost:
      +column_types:
        cost_ratio: numeric
    initial_stock:
      +column_types:
        months_of_cover: numeric
    lead_time:
      +column_types:
        lead_time_days: int64
