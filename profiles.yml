# No secrets here: authentication is Application Default Credentials (`gcloud auth
# application-default login` locally, workload identity in CI).
#
# Cost: the GCP project has no billing account linked (BigQuery sandbox), so it cannot
# be charged; past the free tier queries fail instead of billing. maximum_bytes_billed
# still stops any single query that would scan more than 1 GB (raw is ~100 MB), which
# catches a runaway join long before the sandbox limit does.
olist_retail:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('OLIST_GCP_PROJECT', 'olist-retail-portfolio') }}"
      dataset: "{{ env_var('OLIST_DBT_DATASET', 'dbt_dev') }}"
      location: US
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1
      maximum_bytes_billed: 1000000000
